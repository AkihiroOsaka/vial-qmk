name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions:
  contents: read

jobs:
  build-quantizer:
    name: Build Keyboard Quantizer Mini
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    
    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build Firmware
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        # Keyboard Quantizer Mini の Vial キーマップのみをビルド
        qmk compile -kb sekigon/keyboard_quantizer/mini -km vial

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: keyboard_quantizer_mini_vial
        # ビルドされた .uf2 ファイルを保存
        path: ./*.uf2

    - name: Dump failure logs
      if: failure()
      run: |
        echo '### Failure logs' | tee -a "${GITHUB_STEP_SUMMARY}"
        if [ -d .build ]; then
          cd .build
          for log in failed.log.*; do
            pretty_logname="$(echo "${log}" | sed "s/^failed\.log\.[0-9]\+\.//")"
            printf '\n::group::%s\n%s\n::endgroup::\n' "${pretty_logname}" "$(sed "${REGEX_MAKE_OUTPUT}" < "${log}")"
          done
        else
          echo "No .build directory found."
        fi
