name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGEX_ANSI_COLOR: 's/\x1b\[[0-9;]*[mGKHF]//g'
  REGEX_MAKE_OUTPUT: '/^g*make\[1]: \(Enter\|Leav\)ing directory ''/d'

permissions:
  contents: read

jobs:
  build-quantizer:
    name: Build Keyboard Quantizer Mini
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    
    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install Python dependencies
      run: |
        # image_7ecc27.png で出ている appdirs エラーを解消
        python3 -m pip install appdirs

    - name: Build Firmware
      id: build
      run: |
        git config --global --add safe.directory $(pwd)
        # Quantizerのみをビルド
        qmk compile -kb sekigon/keyboard_quantizer/mini -km vial

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: keyboard_quantizer_mini_vial
        path: ./*.uf2
